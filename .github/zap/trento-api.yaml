env:
  contexts:
    - name: trento
      urls:
        - http://localhost:4000
      includePaths:
        - "http://localhost:4000.*"
      excludePaths:
        # The identity-provider callback answers a handshake the scanner cannot
        # complete, so attacking it buys noise and no coverage. Nothing here is
        # about staying logged in: the token is a stateless JWT re-injected on
        # every request by the replacer rule below, so no endpoint can revoke
        # it for the duration of the scan.
        #
        # This matches POST /api/session/:provider/callback. The SAML route,
        # GET /api/session/:provider/saml_callback, has no /callback segment
        # and is still scanned.
        - "http://localhost:4000/api/session/.*/callback.*"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Injects the bearer token on every request. TRENTO_JWT is substituted before
  # ZAP starts; see the workflow's envsubst step.
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: trento-bearer-token
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: "Bearer ${TRENTO_JWT}"
        tokenProcessing: false

  - type: openapi
    parameters:
      apiFile: /zap/wrk/openapi.json
      targetUrl: http://localhost:4000
      context: trento

  - type: spider
    parameters:
      context: trento
      url: http://localhost:4000
      maxDuration: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: trento
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 20

  - type: report
    parameters:
      template: sarif-json
      reportDir: /zap/wrk/sarif
      reportFile: zap.sarif
