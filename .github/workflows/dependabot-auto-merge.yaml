name: Dependabot Auto-Merge

# Approves patch/minor Dependabot PRs (or flags major ones for review) as soon as they're opened,
# but only merges once the "Continuous Integration" workflow has actually completed successfully for the PR's current head commit.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]

jobs:
  auto-approve:
    name: Auto-approve Dependabot PR
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: write
      issues: write
    concurrency:
      group: dependabot-auto-approve-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve PR
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major version update
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-major' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major version update detected** - requires manual review before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-on-green:
    name: Merge if approved and still green
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      fromJSON(github.event.workflow_run.pull_requests)[0] != null
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: dependabot-auto-merge-${{ fromJSON(github.event.workflow_run.pull_requests)[0].number }}
      cancel-in-progress: true

    steps:
      - name: Merge if approved and still current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ fromJSON(github.event.workflow_run.pull_requests)[0].number }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          if [ "$CURRENT_SHA" != "$CI_SHA" ]; then
            echo "PR has moved on since this CI run ($CURRENT_SHA != $CI_SHA); a newer run will handle it."
            exit 0
          fi

          DECISION=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json reviewDecision -q .reviewDecision)
          if [ "$DECISION" != "APPROVED" ]; then
            echo "PR not approved (decision: $DECISION), not merging."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash
