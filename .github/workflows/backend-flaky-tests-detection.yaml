name: Backend Flaky Tests Analysis

on:
  schedule:
    - cron: "9 19 * * *" # Runs every day at 19:09 Europe/Madrid
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      num_runs:
        description: "Number of times to run tests"
        required: false
        default: "50"

concurrency:
  group: ${{ github.workflow }}

env:
  MIX_ENV: test
  NUM_RUNS: ${{ github.event.inputs.num_runs || 50 }}
  ELIXIR_BC_ENABLED: "false" # set to "true" to also run Elixir jobs against ELIXIR_BC/ERLANG_BC
  ELIXIR_BC: "1.15.7-otp-26"
  ERLANG_BC: "26.2.1"

jobs:
  setup-matrix:
    runs-on: ubuntu-24.04
    outputs:
      ELIXIR_MATRIX: ${{ steps.compute-matrix.outputs.ELIXIR_MATRIX }}
      ELIXIR_VERSIONS: ${{ steps.compute-matrix.outputs.ELIXIR_VERSIONS }}
      ANALYSIS_MATRIX: ${{ steps.compute-matrix.outputs.ANALYSIS_MATRIX }}
      run_range: ${{ steps.compute-matrix.outputs.run_range }}
      total-runs: ${{ steps.compute-matrix.outputs.total-runs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gather versions
        uses: endorama/asdf-parse-tool-versions@e60863920ff5af9bf1c794ffbaaef91384b07eed # v1.6.0
      - name: Compute matrix
        id: compute-matrix
        run: |
          ELIXIR_MATRIX=$(jq -cn \
            --arg bc_enabled "${{ env.ELIXIR_BC_ENABLED }}" \
            --arg elixir_bc "${{ env.ELIXIR_BC }}" --arg otp_bc "${{ env.ERLANG_BC }}" \
            --arg elixir_dev "${{ env.ELIXIR_VERSION }}" --arg otp_dev "${{ env.ERLANG_VERSION }}" \
            '(if $bc_enabled == "true" then [{elixir: $elixir_bc, otp: $otp_bc}] else [] end)
              + [{elixir: $elixir_dev, otp: $otp_dev}]')
          echo "ELIXIR_MATRIX=$ELIXIR_MATRIX" >> $GITHUB_OUTPUT
          echo "ELIXIR_VERSIONS=$(jq -c 'map(.elixir)' <<< "$ELIXIR_MATRIX")" >> $GITHUB_OUTPUT
          echo "ANALYSIS_MATRIX=$(jq -c 'reverse | map({
            "suite-name": "Backend — Elixir \(.elixir), OTP \(.otp)",
            "junit-artifact-pattern": "backend-junit-reports-elixir\(.elixir)-*"
          })' <<< "$ELIXIR_MATRIX")" >> $GITHUB_OUTPUT
          echo "run_range=[$(seq -s, 1 ${{ env.NUM_RUNS }})]" >> $GITHUB_OUTPUT
          echo "total-runs=${{ env.NUM_RUNS }}" >> $GITHUB_OUTPUT

  elixir-deps:
    name: Elixir test dependencies (Elixir ${{ matrix.elixir }})
    needs: [setup-matrix]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.ELIXIR_MATRIX) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup
        id: setup-elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Retrieve Elixir Cached Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        id: mix-cache
        with:
          path: |
            deps
            _build/${{ env.MIX_ENV }}
            priv/plts
          key: erlang-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}-${{ env.MIX_ENV }}
      - name: Install Dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p priv/plts
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix deps.compile --warnings-as-errors
          mix dialyzer --plt

  test-backend:
    name: Backend Tests (Elixir ${{ matrix.elixir }}, Run ${{ matrix.run }})
    needs: [setup-matrix, elixir-deps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.setup-matrix.outputs.run_range) }}
        elixir: ${{ fromJson(needs.setup-matrix.outputs.ELIXIR_VERSIONS) }}
        include: ${{ fromJson(needs.setup-matrix.outputs.ELIXIR_MATRIX) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup
        id: setup-elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Retrieve Elixir Cached Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        id: mix-cache
        with:
          path: |
            deps
            _build/${{ env.MIX_ENV }}
            priv/plts
          key: erlang-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}-${{ env.MIX_ENV }}
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: "Docker compose dependencies"
        uses: isbang/compose-action@ee6af68587292d72db67743171809c19787df4c9 # v3.1.0
        with:
          compose-file: "./docker-compose.yaml"
          down-flags: "--volumes"
      - name: Run backend tests
        env:
          WRITE_JUNIT: 1
        run: mix test --warnings-as-errors --max-cases 1
      - name: Copy and sanitize JUnit reports
        if: always()
        run: |
          mkdir -p ./junit-reports
          for file in /tmp/*.xml; do
            if [ -f "$file" ]; then
              # Sanitize filename: GitHub Actions artifact names cannot contain colons
              base=$(basename "$file" | tr ':' '-' | tr ' ' '_')
              awk '{gsub(/:/, "-"); print}' "$file" > "./junit-reports/$base"
            fi
          done
      - name: Upload backend test junit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-junit-reports-elixir${{ matrix.elixir }}-run${{ matrix.run }}
          path: junit-reports/*.xml
          retention-days: 1

  flaky-tests-analysis:
    needs: [setup-matrix, test-backend]
    if: ${{ !cancelled() }}
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.ANALYSIS_MATRIX) }}
    uses: ./.github/workflows/flaky-tests-analysis.yaml
    with:
      suite-name: ${{ matrix.suite-name }}
      junit-artifact-pattern: ${{ matrix.junit-artifact-pattern }}
      total-runs: ${{ needs.setup-matrix.outputs.total-runs }}
    secrets:
      SLACK_FLAKY_TESTS_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_FLAKY_TESTS_ALERT_WEBHOOK_URL }}
