name: Backend Flaky Tests Analysis

on:
  schedule:
    - cron: "9 19 * * *" # Runs every day at 19:09 Europe/Madrid
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      num_runs:
        description: "Number of times to run tests"
        required: false
        default: "50"

concurrency:
  group: ${{ github.workflow }}

env:
  MIX_ENV: test
  NUM_RUNS: ${{ github.event.inputs.num_runs || 50 }}

jobs:
  elixir-toolchain:
    name: Elixir toolchain
    uses: trento-project/.github/.github/workflows/elixir-toolchain.yaml@shared-elixir-otp-toolchain-matrix
    with:
      bc_enabled: true
      elixir_bc: "1.15.7-otp-26"
      erlang_bc: "26.2.1"

  setup-matrix:
    runs-on: ubuntu-24.04
    outputs:
      run_range: ${{ steps.compute-matrix.outputs.run_range }}
      total-runs: ${{ steps.compute-matrix.outputs.total-runs }}
    steps:
      - name: Compute matrix
        id: compute-matrix
        run: |
          echo "run_range=[$(seq -s, 1 ${{ env.NUM_RUNS }})]" >> $GITHUB_OUTPUT
          echo "total-runs=${{ env.NUM_RUNS }}" >> $GITHUB_OUTPUT

  elixir-deps:
    name: Elixir test dependencies
    needs: [elixir-toolchain]
    uses: trento-project/.github/.github/workflows/elixir-deps.yaml@shared-elixir-otp-toolchain-matrix
    with:
      toolchains: ${{ needs.elixir-toolchain.outputs.TOOLCHAINS }}
      mix_envs: '["test"]'

  test-backend:
    name: Backend Tests (Elixir ${{ matrix.toolchain.elixir }}, Run ${{ matrix.run }})
    needs: [elixir-toolchain, setup-matrix, elixir-deps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.setup-matrix.outputs.run_range) }}
        toolchain: ${{ fromJson(needs.elixir-toolchain.outputs.TOOLCHAINS) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Elixir and restore cached dependencies
        id: mix-cache
        uses: trento-project/.github/actions/setup-elixir@shared-elixir-otp-toolchain-matrix
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: "Docker compose dependencies"
        uses: isbang/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3.2.0
        with:
          compose-file: "./docker-compose.yaml"
          down-flags: "--volumes"
      - name: Run backend tests
        env:
          WRITE_JUNIT: 1
        run: mix test --warnings-as-errors --max-cases 1
      - name: Copy and sanitize JUnit reports
        if: always()
        run: |
          mkdir -p ./junit-reports
          for file in /tmp/*.xml; do
            if [ -f "$file" ]; then
              # Sanitize filename: GitHub Actions artifact names cannot contain colons
              base=$(basename "$file" | tr ':' '-' | tr ' ' '_')
              awk '{gsub(/:/, "-"); print}' "$file" > "./junit-reports/$base"
            fi
          done
      - name: Upload backend test junit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-junit-reports-elixir${{ matrix.toolchain.elixir }}-run${{ matrix.run }}
          path: junit-reports/*.xml
          retention-days: 1

  flaky-tests-analysis:
    needs: [elixir-toolchain, setup-matrix, test-backend]
    if: ${{ !cancelled() }}
    strategy:
      max-parallel: 1
      matrix:
        toolchain: ${{ fromJson(needs.elixir-toolchain.outputs.TOOLCHAINS) }}
    uses: ./.github/workflows/flaky-tests-analysis.yaml
    with:
      suite-name: "Backend — Elixir ${{ matrix.toolchain.elixir }}, OTP ${{ matrix.toolchain.otp }}"
      junit-artifact-pattern: backend-junit-reports-elixir${{ matrix.toolchain.elixir }}-*
      total-runs: ${{ needs.setup-matrix.outputs.total-runs }}
    secrets:
      SLACK_FLAKY_TESTS_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_FLAKY_TESTS_ALERT_WEBHOOK_URL }}
