---
name: Backport PR

on:
  pull_request:
    branches: [main]
    types: [closed, labeled]

jobs:
  backport:
    name: Backport
    uses: trento-project/.github/.github/workflows/backport-pr.yaml@9eeba3813dd18bf0350ba0c867ef0f3f2cc26342 # v1.13.0
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      ssh_key: ${{ secrets.TRENTOBOT_SSH_KEY }}
      gpg_key: ${{ secrets.TRENTOBOT_GPG_KEY }}
