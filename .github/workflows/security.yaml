name: Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly, so DAST has a regular unattended run without costing every PR.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Deliberately no cancel-in-progress: a cancelled run uploads no SARIF, which
# code scanning interprets as the findings having been resolved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  MIX_ENV: test
  OSV_SCANNER_VERSION: "v2.5.0" # https://github.com/google/osv-scanner/releases
  # Only stable tags: the w2026-* weekly builds report themselves as "Dev Build",
  # which the SARIF upload validator rejects.
  ZAP_VERSION: "2.17.0" # https://github.com/zaproxy/zaproxy/releases
  # Unlike ZAP_VERSION, this tag needs its leading "v": nuclei's own release
  # tags are versioned that way and the bare digits are not a real tag.
  NUCLEI_VERSION: "v3.11.1" # https://github.com/projectdiscovery/nuclei/releases

jobs:
  sast-elixir:
    name: SAST Elixir (Sobelow)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Gather toolchain versions
        uses: endorama/asdf-parse-tool-versions@e60863920ff5af9bf1c794ffbaaef91384b07eed # v1.6.0

      - name: Setup Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Same key shape as ci.yaml's elixir-deps job, so this restores that cache.
      - name: Retrieve Elixir cached dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/${{ env.MIX_ENV }}
            priv/plts
          key: erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-${{ env.MIX_ENV }}

      - name: Install dependencies
        run: mix deps.get

      - name: Create report directory
        run: mkdir -p sarif

      - name: Run Sobelow
        continue-on-error: true
        run: mix sobelow --format sarif --out sarif/sobelow.sarif

      - name: Publish SARIF
        if: always()
        uses: ./.github/actions/publish-sarif
        with:
          name: sobelow
          path: sarif/sobelow.sarif
          category: sobelow

  sca:
    name: Dependency scanning (OSV-Scanner)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create report directory
        run: mkdir -p sarif

      # Git-sourced deps (langchain, gen_rmq, trento_contracts) resolve to commit
      # SHAs in mix.lock, so Hex advisory matching does not cover them.
      - name: Run OSV-Scanner
        continue-on-error: true
        env:
          OSV_IMAGE: ghcr.io/google/osv-scanner:${{ env.OSV_SCANNER_VERSION }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src "$OSV_IMAGE" \
            scan source \
            --lockfile mix.lock \
            --lockfile assets/package-lock.json \
            --format sarif --output /src/sarif/osv.sarif

      - name: Publish SARIF
        if: always()
        uses: ./.github/actions/publish-sarif
        with:
          name: osv
          path: sarif/osv.sarif
          category: osv

  sast-js-lint:
    name: SAST JS (ESLint security rules)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Gather toolchain versions
        uses: endorama/asdf-parse-tool-versions@e60863920ff5af9bf1c794ffbaaef91384b07eed # v1.6.0

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODEJS_VERSION }}

      # Same key shape as ci.yaml's npm-cache steps, so this restores that cache.
      - name: Retrieve NPM cached dependencies
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            assets/node_modules
          key: nodejs-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('assets/package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: cd assets && npm ci

      - name: Create report directory
        run: mkdir -p sarif

      - name: Run ESLint security rules
        continue-on-error: true
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: 'true'
        run: |
          cd assets && npx eslint . \
            --config eslint.security.config.mjs \
            -f @microsoft/eslint-formatter-sarif \
            -o ../sarif/eslint.sarif

      - name: Publish SARIF
        if: always()
        uses: ./.github/actions/publish-sarif
        with:
          name: eslint-security
          path: sarif/eslint.sarif
          category: eslint-security

  sast-js:
    name: SAST ${{ matrix.language }} (CodeQL)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            category: codeql-javascript
          - language: actions
            category: codeql-actions
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/config.yml

      # No continue-on-error here, unlike the other scanners: CodeQL exits
      # non-zero only on an infrastructure fault, never on findings, so
      # tolerating a failure would hide a scanner that stopped running.
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: ${{ matrix.category }}
          output: sarif
          upload: never
          upload-database: false

      # CodeQL names its output after the database language, which does not always
      # match the `languages:` input, so normalise to a deterministic filename.
      - name: Normalise the SARIF filename
        if: always()
        shell: bash
        env:
          TARGET: sarif/${{ matrix.category }}.sarif
        run: |
          set -euo pipefail
          shopt -s nullglob
          produced=(sarif/*.sarif)
          if [ ${#produced[@]} -ne 1 ]; then
            printf '%s\n' "${produced[@]}"
            echo "::error::expected exactly one SARIF file in sarif/, found ${#produced[@]}"
            exit 1
          fi
          [ "${produced[0]}" = "$TARGET" ] || mv "${produced[0]}" "$TARGET"

      - name: Publish SARIF
        if: always()
        uses: ./.github/actions/publish-sarif
        with:
          name: ${{ matrix.category }}
          path: sarif/${{ matrix.category }}.sarif
          category: ${{ matrix.category }}

  dast:
    name: DAST (ZAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'dast'))
    # Overrides the workflow default. The application is started and exercised
    # here, matching the E2E job in ci.yaml. The active scan mutates the target,
    # so this must only ever run against a throwaway instance.
    env:
      MIX_ENV: dev
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Gather toolchain versions
        uses: endorama/asdf-parse-tool-versions@e60863920ff5af9bf1c794ffbaaef91384b07eed # v1.6.0

      - name: Setup Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODEJS_VERSION }}

      # Same key shape as ci.yaml's dev-mode jobs, so this restores their cache.
      # Restore only, deliberately: a read-write cache action here would save
      # under a key that ci.yaml owns.
      - name: Retrieve Elixir cached dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/${{ env.MIX_ENV }}
            priv/plts
          key: erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-${{ env.MIX_ENV }}

      - name: Retrieve NPM cached dependencies
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            assets/node_modules
          key: nodejs-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('assets/package-lock.json') }}

      # The dev endpoint's watchers run `node build.js` and `npx tailwindcss`
      # from assets/, so a cache miss would otherwise leave the application
      # serving no assets and ZAP spidering a broken page.
      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: cd assets && npm ci

      - name: Docker compose dependencies
        uses: isbang/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
        with:
          compose-file: "./docker-compose.yaml"
          compose-flags: "--profile wanda"
          down-flags: "--volumes"

      - name: Mix setup
        run: mix setup

      - name: Generate OpenAPI spec
        run: mix openapi.spec.json --start-app=false --spec TrentoWeb.OpenApi.All.ApiSpec

      - name: Run trento detached
        run: mix phx.server &

      # A dead target makes ZAP report a clean scan. That is the worst possible
      # outcome, so readiness is a hard failure rather than report-only.
      - name: Wait for the application to become ready
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/readyz > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready within 120s"
          exit 1

      # An unauthenticated scan reaches almost nothing and still reports green,
      # so assert the token works before handing it to ZAP.
      #
      # The token is signed directly rather than obtained from POST /api/session
      # because access_token_expiration is 180 seconds and is read through
      # compile_env, so no environment variable can extend it: a session token
      # dies three minutes into a twenty minute scan and the rest of the run
      # bounces off 401s. --no-start is required, otherwise mix boots a second
      # copy of the application against the one already serving port 4000.
      # sub 1 is the seeded admin.
      - name: Mint and verify an API token
        id: token
        run: |
          set -euo pipefail
          mix run --no-start -e '
            File.write!("/tmp/trento-jwt.txt",
              TrentoWeb.Auth.AccessToken.generate_access_token!(%{
                "sub" => 1,
                "exp" => System.system_time(:second) + 3600
              }))'
          token="$(cat /tmp/trento-jwt.txt)"
          if [[ -z "$token" ]]; then
            echo "Failed to mint an access token"
            exit 1
          fi
          echo "::add-mask::$token"
          # -L because /api/hosts is the unversioned redirector and answers 307.
          status="$(curl -sL -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" http://localhost:4000/api/hosts)"
          if [[ "$status" != "200" ]]; then
            echo "Token did not authenticate: GET /api/hosts returned $status"
            exit 1
          fi
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # ZAP runs as uid 1000 inside its image while the workspace belongs to the
      # runner user, so the report directory has to be writable by both for the
      # report job to write through the bind mount.
      - name: Create report directory
        run: |
          set -euo pipefail
          mkdir -p sarif
          chmod 0777 sarif

      - name: Resolve the ZAP plan
        env:
          TRENTO_JWT: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The single quotes are deliberate: envsubst takes the list of names
          # to substitute as a literal shell-format string.
          # shellcheck disable=SC2016
          envsubst '${TRENTO_JWT}' < .github/zap/trento-api.yaml > /tmp/zap-plan.yaml

      - name: Run ZAP
        continue-on-error: true
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:${{ env.ZAP_VERSION }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD:/zap/wrk:rw" \
            -v /tmp/zap-plan.yaml:/zap/wrk/plan.yaml:ro \
            "$ZAP_IMAGE" \
            zap.sh -cmd -autorun /zap/wrk/plan.yaml

      # Runs after ZAP so a ZAP failure never costs the Nuclei results. Unlike
      # ZAP, Nuclei is not given the bearer token: it runs unauthenticated
      # against the same target, which is enough for its template-based checks
      # and means its SARIF needs no redaction pass.
      #
      # -ni (no-interactsh) turns off the out-of-band templates, which rely on
      # the target reaching back out to a public interactsh server. This
      # target is only reachable on the runner's own network, so those
      # templates could never produce a real match; left on, every one of them
      # still pays the interaction poll and cooldown wait for nothing.
      #
      # The image has no bundled templates and runs as root (unlike ZAP's uid
      # 1000), so it fetches nuclei-templates fresh on every run and writes
      # into the sarif/ directory the previous step already made
      # world-writable without needing that permission itself. -duc
      # (disable-update-check) was considered to pin this down further, but it
      # disables that initial template fetch too, not just the version-check
      # log line, and the scan then fails outright with no templates loaded.
      #
      # Nuclei writes no file at all when it finds nothing, which the next step
      # turns into an empty report rather than a missing one.
      - name: Run Nuclei
        id: nuclei
        continue-on-error: true
        env:
          NUCLEI_IMAGE: projectdiscovery/nuclei:${{ env.NUCLEI_VERSION }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD/sarif:/sarif:rw" \
            "$NUCLEI_IMAGE" \
            -target http://localhost:4000 \
            -ni \
            -sarif-export /sarif/nuclei.sarif

      # Uploading nothing is not the same as uploading no findings. Code
      # scanning moves an alert to "fixed" only when a later analysis for the
      # same category leaves it out, so a clean run that publishes no file at
      # all leaves every Nuclei alert ever filed open, with no way for the
      # automation to close it. Synthesising the empty report keeps that
      # lifecycle working, and lets the publish step keep the strict
      # missing-file check every other scanner gets.
      #
      # Only for a scan that ran to completion. `outcome` is the step's real
      # result, which continue-on-error hides from `conclusion`; a Nuclei that
      # died also writes no file, and standing in an empty report for it would
      # close alerts on the word of a scanner that never ran. Left missing, the
      # strict publish step below fails the job instead.
      #
      # The driver name is spelled the way Nuclei spells it in its own reports,
      # so the empty analysis is not attributed to a different tool.
      # NUCLEI_VERSION comes from the workflow env; the tag carries a leading
      # "v" that the SARIF version field should not.
      - name: Ensure Nuclei produced a report
        if: steps.nuclei.outcome == 'success'
        run: |
          set -euo pipefail
          if [[ ! -f sarif/nuclei.sarif ]]; then
            jq -n --arg version "${NUCLEI_VERSION#v}" '{
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                {
                  "tool": {"driver": {"name": "Nuclei", "version": $version}},
                  "results": []
                }
              ]
            }' > sarif/nuclei.sarif
            echo "Nuclei reported nothing; published an empty report instead"
          fi

      # Without this the run's only annotation for a dead Nuclei comes from the
      # publish step, which reports a missing file and so blames the upload for
      # a scanner fault. The job still fails there — this only names the cause.
      - name: Report a Nuclei that did not complete
        if: steps.nuclei.outcome != 'success'
        run: |
          set -euo pipefail
          echo "::error::Nuclei did not complete; no report was produced, so the publish step below fails on the missing file"

      # The sarif-json template appends its own extension to reportFile, so the
      # plan's `zap.sarif` lands as `zap.sarif.json`. Move it out of the
      # workspace rather than renaming it in place: `sarif/zap.sarif` is the
      # path the publish step reads, both publish steps are `if: always()` and
      # so also run on a cancellation or a job timeout, and the report is not
      # fit to publish until the next step has redacted it. Only that step may
      # create `sarif/zap.sarif`.
      #
      # Move only when the file is there: if the scan produced no report at
      # all, publish-sarif is the step that should say so, rather than this one
      # failing first and pointing at the wrong component.
      #
      # The `rm` enforces the claim above rather than inheriting it from the
      # report template's naming. Were a future ZAP to stop appending `.json`,
      # it would write the unredacted report straight into the published path,
      # and the `always()` publish step would upload it.
      - name: Set the raw ZAP report aside
        run: |
          set -euo pipefail
          if [[ -f sarif/zap.sarif.json ]]; then
            mv sarif/zap.sarif.json /tmp/zap-raw.json
          elif [[ -f sarif/zap.sarif ]]; then
            mv sarif/zap.sarif /tmp/zap-raw.json
          fi
          rm -f sarif/zap.sarif

      # ZAP embeds whole requests and responses in the report, and Phoenix debug
      # error pages echo the Authorization header back, so the bearer token and
      # freshly generated API keys end up in a file that is uploaded to code
      # scanning and kept as an artifact for thirty days. ::add-mask:: only
      # redacts log output, it does not touch file contents.
      #
      # Requests, responses and the per-alert evidence snippet are removed
      # structurally, not searched for secrets. All three are verbatim
      # fragments of a scanned request or response, so no list of known strings
      # can be a reliable gate on what they contain: the passive cookie rules
      # alone quote whole Set-Cookie headers, which on a Phoenix application is
      # the signed session cookie. The token walk that follows is a backstop
      # for the token appearing anywhere else in the file, not the gate.
      #
      # An unredacted report must never reach the publish step, so the redacted
      # copy is built in /tmp and only moved into the published path once every
      # check has passed. Any failure discards both copies.
      - name: Redact credentials from the SARIF
        env:
          TRENTO_JWT: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/zap-raw.json ]]; then
            echo "No report to redact"
            exit 0
          fi
          if ! jq --arg token "$TRENTO_JWT" '
                 del(.runs[]?.results[]?.webRequest, .runs[]?.results[]?.webResponse)
                 | walk(if type == "object" and has("snippet")
                        then del(.snippet)
                        elif type == "string"
                        then (split($token) | join("REDACTED"))
                        else . end)
               ' /tmp/zap-raw.json > /tmp/zap-redacted.json; then
            rm -f /tmp/zap-raw.json /tmp/zap-redacted.json
            echo "::error::could not redact the ZAP report; the unredacted report was discarded"
            exit 1
          fi
          # grep answers 1 for "no match" and 2 for an error such as a file it
          # could not read. Only 1 means the report is clean, so anything else
          # discards it: this is the last gate on a credential.
          rc=0
          grep -qF -- "$TRENTO_JWT" /tmp/zap-redacted.json || rc=$?
          if [[ "$rc" -ne 1 ]]; then
            rm -f /tmp/zap-raw.json /tmp/zap-redacted.json
            echo "::error::redaction could not be confirmed (grep exited ${rc}); the report was discarded"
            exit 1
          fi
          mv /tmp/zap-redacted.json sarif/zap.sarif
          rm -f /tmp/zap-raw.json

      # Code scanning resolves every result location against the checked-out
      # tree and rejects the entire file when one carries a URL instead of a
      # path. ZAP reports URLs, so its results are rewritten to point at the
      # plan file that configures the scan, with the scanned URL moved into the
      # alert message. Nuclei already reports a repo-relative path and passes
      # through untouched; it is included so that a future version emitting
      # URLs does not silently break the upload. Rationale is in the script.
      - name: Anchor the DAST findings to a repository file
        env:
          ANCHOR_PATH: .github/zap/trento-api.yaml
        run: |
          set -euo pipefail
          for report in sarif/zap.sarif sarif/nuclei.sarif; do
            SARIF_PATH="$report" .github/scripts/anchor-dast-sarif.sh
          done

      # Gated on the token step rather than plain always(): both publish steps
      # are strict about a missing report, and bring-up runs before them, so a
      # compose, mix setup, readiness or token failure would otherwise be
      # announced as "No SARIF file at sarif/zap.sarif" and blame the publish
      # step for a fault that happened well upstream. Minting the token is the
      # last bring-up step, so its outcome stands for all of them.
      - name: Publish SARIF
        if: always() && steps.token.outcome == 'success'
        uses: ./.github/actions/publish-sarif
        with:
          name: zap
          path: sarif/zap.sarif
          category: zap

      # Strict, like every other publish step in this workflow: a clean scan
      # has an empty report synthesised for it above, so a missing file here
      # means Nuclei died before writing anything.
      - name: Publish Nuclei SARIF
        if: always() && steps.token.outcome == 'success'
        uses: ./.github/actions/publish-sarif
        with:
          name: nuclei
          path: sarif/nuclei.sarif
          category: nuclei
